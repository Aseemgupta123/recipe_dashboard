function loadInitial() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data) data = JSON.parse(document.getElementById('default-data').textContent);

  let seeded = [];
  try { seeded = JSON.parse(localStorage.getItem(SEEDS_KEY) || '[]'); } catch (e) {}
  let changed = false;
  for (const s of SEEDS) {
    if (!seeded.includes(s.id)) {
      data = s.apply(data);
      seeded.push(s.id);
      changed = true;
    }
  }
  if (changed) localStorage.setItem(SEEDS_KEY, JSON.stringify(seeded));
  return data;
}

/* ---------- GitHub save / pull ---------- */
async function saveToGitHub(data, token) {
  const api = `https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(GH_PATH)}`;
  const meta = await fetch(api, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
  }).then(r => r.json());
  if (!meta.sha) throw new Error('Could not read file from GitHub');
  const raw = await fetch(meta.download_url).then(r => r.text());
  const updated = raw.replace(
    /(<script type="application\/json" id="default-data">\n)[\s\S]*?(\n<\/script>)/,
    `$1${JSON.stringify(data, null, 2)}\n$2`
  );
  const encoded = btoa(unescape(encodeURIComponent(updated)));
  const res = await fetch(api, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'update recipes', content: encoded, sha: meta.sha })
  });
  if (!res.ok) throw new Error('GitHub write failed');
}

async function pullFromGitHub(token) {
  const api = `https://api.github.com/repos/${GH_REPO}/contents/${encodeURIComponent(GH_PATH)}`;
  const meta = await fetch(api, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
  }).then(r => r.json());
  if (!meta.download_url) throw new Error('Could not reach GitHub');
  const raw = await fetch(meta.download_url).then(r => r.text());
  const match = raw.match(/<script type="application\/json" id="default-data">\n([\s\S]*?)\n<\/script>/);
  if (!match) throw new Error('Could not parse data from GitHub file');
  return JSON.parse(match[1]);
}

/* ---------- Image-less art: a procedural "plate" SVG keyed off the recipe name ---------- */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const RecipePlate = React.memo(function RecipePlate({ name, hue, size = 96 }) {
  const h = hashStr(name || 'x');
  const baseHue = (hue ?? 60);
  const accentHue = (baseHue + 25) % 360;
  const r1 = 38 + (h % 14);
  const r2 = 22 + ((h>>3) % 12);
  const r3 = 10 + ((h>>5) % 6);
  const a1 = (h % 360);
  const a2 = ((h>>4) % 360);
  const seedX = 30 + (h % 40);
  const seedY = 30 + ((h>>2) % 40);
  // garnish dot count
  const dots = 3 + ((h>>6) % 4);
  const garnish = Array.from({length: dots}).map((_, i) => {
    const ang = (i * 360 / dots + a1) * Math.PI / 180;
    const rad = r2 - 6;
    return { cx: 50 + Math.cos(ang)*rad*0.5, cy: 50 + Math.sin(ang)*rad*0.5, r: 1.6 + ((h>>(i+1)) % 3) };
  });
  const initial = (name || '?').trim().slice(0,1).toUpperCase();
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} aria-hidden="true" style={{display:'block'}}>
      <defs>
        <radialGradient id={`bg-${h}`} cx="40%" cy="35%" r="80%">
          <stop offset="0%"  stopColor={`oklch(0.40 0.06 ${baseHue})`} />
          <stop offset="60%" stopColor={`oklch(0.28 0.04 ${baseHue})`} />
          <stop offset="100%" stopColor={`oklch(0.20 0.03 ${baseHue})`} />
        </radialGradient>
        <radialGradient id={`plate-${h}`} cx="35%" cy="30%" r="75%">
          <stop offset="0%"  stopColor={`oklch(0.94 0.02 ${baseHue})`} />
          <stop offset="100%" stopColor={`oklch(0.78 0.03 ${baseHue})`} />
        </radialGradient>
        <radialGradient id={`food-${h}`} cx="50%" cy="50%" r="60%">
          <stop offset="0%" stopColor={`oklch(0.78 0.16 ${accentHue})`} />
          <stop offset="100%" stopColor={`oklch(0.55 0.14 ${accentHue})`} />
        </radialGradient>
      </defs>
      <rect width="100" height="100" fill={`url(#bg-${h})`} />
      {/* faint grid lines */}
      <g stroke={`oklch(0.96 0.01 ${baseHue} / 0.05)`} strokeWidth="0.4">
        <line x1="0" y1="25" x2="100" y2="25" />
        <line x1="0" y1="50" x2="100" y2="50" />
        <line x1="0" y1="75" x2="100" y2="75" />
        <line x1="25" y1="0" x2="25" y2="100" />
        <line x1="50" y1="0" x2="50" y2="100" />
        <line x1="75" y1="0" x2="75" y2="100" />
      </g>
      {/* plate */}
      <circle cx="50" cy="50" r={r1} fill={`url(#plate-${h})`} stroke={`oklch(0.20 0.02 ${baseHue})`} strokeWidth="0.5" />
      <circle cx="50" cy="50" r={r1-3} fill="none" stroke={`oklch(0.50 0.02 ${baseHue} / 0.3)`} strokeWidth="0.4" />
      {/* food blob */}
      <circle cx="50" cy="50" r={r2} fill={`url(#food-${h})`} />
      <circle cx={50 - r3*0.4} cy={50 - r3*0.4} r={r3} fill={`oklch(0.92 0.05 ${accentHue})`} opacity="0.9" />
      {/* garnish */}
      {garnish.map((g, i) => (
        <circle key={i} cx={g.cx} cy={g.cy} r={g.r} fill={`oklch(0.72 0.18 ${(accentHue + i*40) % 360})`} opacity="0.9" />
      ))}
      {/* tiny initial mark */}
      <text x="8" y="93" fontFamily="JetBrains Mono, monospace" fontSize="6" fill={`oklch(0.96 0.01 ${baseHue} / 0.55)`}>· {initial}</text>
    </svg>
  );
});

/* ---------- Inline editable text ---------- */
function Editable({ value, onChange, className, placeholder, as = 'span', maxLen, ariaLabel }) {
  const editable = React.useContext(EditCtx);
  const ref = useRef(null);
  const Tag = as;

  // Only sync from props on mount or when the source value truly changes externally —
  // never while the user is typing.
  useEffect(() => {
    if (!ref.current) return;
    if (document.activeElement === ref.current) return;
    if (ref.current.textContent !== value) ref.current.textContent = value || '';
  }, [value]);

  const onInput = e => {
    let txt = e.currentTarget.textContent || '';
    if (maxLen && txt.length > maxLen) txt = txt.slice(0, maxLen);
    onChange(txt);
  };
  const onKeyDown = e => {
    if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
  };
  const onPaste = e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    document.execCommand('insertText', false, text.replace(/\n/g, ' '));
  };
  return (
    <Tag
      ref={ref}
      className={className}
      contentEditable={editable}
      suppressContentEditableWarning
      spellCheck={false}
      onInput={editable ? onInput : undefined}
      onKeyDown={editable ? onKeyDown : undefined}
      onPaste={editable ? onPaste : undefined}
      data-placeholder={editable ? placeholder : undefined}
      aria-label={ariaLabel}
    />
  );
}

    const hues = [25, 350, 55, 130, 200, 285, 320];
    const used = data.tabs.map(t => t.hue);
    const hue = hues.find(h => !used.includes(h)) ?? Math.floor(Math.random()*360);
    const tab = { id, name: 'New cuisine', hue, recipes: [] };
    setData(d => ({ ...d, tabs: [...d.tabs, tab] }));
    setActiveId(id);
  };

  const updateRecipe = (tabId, recipeId, mut) => updateTab(tabId, t => ({
    ...t, recipes: t.recipes.map(r => r.id === recipeId ? mut(r) : r)
  }));
  const removeRecipe = (tabId, recipeId) => updateTab(tabId, t => ({
    ...t, recipes: t.recipes.filter(r => r.id !== recipeId)
  }));
  const addRecipe = (tabId) => {
    const r = { id: uid('r'), name: 'New dish', time: '30 min', tag: 'New', note: 'Click to add notes or method.', ingredients: [], link: '', image: '' };
    updateTab(tabId, t => ({ ...t, recipes: [...t.recipes, r] }));
    // open it
    setTimeout(() => setOpenRecipe({ tabId, recipeId: r.id }), 30);
  };

  const visibleRecipes = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) {
      if (!activeTab) return [];
      return activeTab.recipes.map(r => ({ recipe: r, tab: activeTab }));
    }
    return data.tabs.flatMap(t =>
      t.recipes
        .filter(r =>
          r.name.toLowerCase().includes(q) ||
          r.tag.toLowerCase().includes(q) ||
          (r.note||'').toLowerCase().includes(q) ||
          (r.ingredients||[]).some(i => i.toLowerCase().includes(q))
        )
        .map(r => ({ recipe: r, tab: t }))
    );
  }, [activeTab, query, data.tabs]);

  const totalRecipes = useMemo(() => data.tabs.reduce((n, t) => n + t.recipes.length, 0), [data]);

  const openR = openRecipe ? data.tabs.find(t=>t.id===openRecipe.tabId)?.recipes.find(r=>r.id===openRecipe.recipeId) : null;

  return (
    <EditCtx.Provider value={canEdit}>
    <div className="page">
      {/* HEADER */}
      <header className="hdr">
        <div className="hdr-left">
          <div className="logo" aria-hidden="true">
            <span className="logo-mark"></span>
          </div>
          <div className="hdr-text">
<h1 className="title serif">Library of Recipes</h1>
          </div>
        </div>
        <div className="hdr-right">
          <div className="search">
            <Ico.search />
            <input
              type="text"
              placeholder="Find a dish, ingredient, mood…"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
            {query && <button className="search-clear" onClick={()=>setQuery('')} aria-label="Clear"><Ico.x/></button>}
          </div>
          <div className="stats mono">
            <span><b>{totalRecipes}</b> recipes</span>
            <span className="dot">·</span>
            <span><b>{data.tabs.length}</b> cuisines</span>
          </div>
        </div>
      </header>

      {/* TABS */}
      <nav className="tabs scroll-x" aria-label="Cuisines">
        {data.tabs.map(t => {
          const isActive = t.id === activeId;
          return (
            <div key={t.id}
                 className={`tab ${isActive ? 'on':''}`}
                 style={{ '--tab-hue': t.hue }}
                 onClick={() => setActiveId(t.id)}>
              <span className="tab-dot" />
              <Editable
                as="span"
                className="tab-name"
                value={t.name}
                placeholder="Cuisine"
                maxLen={28}
                ariaLabel="Cuisine name"
                onChange={(v) => renameTab(t.id, v)}
              />
              <span className="tab-count mono">{t.recipes.length}</span>
              {canEdit && (
                <button
                  className="tab-x"
                  aria-label={`Remove ${t.name}`}
                  onClick={(e) => { e.stopPropagation(); setConfirmTab(t.id); }}
                ><Ico.x/></button>
              )}
            </div>
          );
        })}
        {canEdit && (
          <button className="tab tab-add" onClick={addTab} aria-label="Add cuisine">
            <Ico.plus /> <span>Add cuisine</span>
          </button>
        )}
      </nav>

      {/* MAIN */}
      <main className="main">
        {activeTab ? (
          <>
            <div className="section-head">
              <div className="section-head-l">
                <div className="cuisine-tag" style={{ '--tab-hue': activeTab.hue }}>
                  <span className="cuisine-swatch"/>
                  <span className="mono">{activeTab.name.toUpperCase()}</span>
                </div>
                <div className="kicker mono" style={{marginTop: 6}}>
                  {query
                    ? <>{visibleRecipes.length} result{visibleRecipes.length !== 1 ? 's' : ''} across all cuisines · matching "{query}"</>
                    : <>{visibleRecipes.length} of {activeTab.recipes.length} dishes</>
                  }
                </div>
              </div>
              {canEdit && (
                <button className="btn-primary" onClick={()=>addRecipe(activeTab.id)}>
                  <Ico.plus/> <span>New recipe</span>
                </button>
              )}
            </div>

            {activeTab.recipes.length === 0 && !query ? (
              <EmptyState onAdd={()=>addRecipe(activeTab.id)} />
            ) : visibleRecipes.length === 0 ? (
              <NoMatch query={query} onClear={()=>setQuery('')} />
            ) : (
              <ul className="grid">
                {visibleRecipes.map(({ recipe: r, tab: t }) => (
                  <RecipeCard
                    key={r.id}
                    recipe={r}
                    hue={t.hue}
                    onOpen={() => setOpenRecipe({ tabId: t.id, recipeId: r.id })}
                    onRemove={() => removeRecipe(t.id, r.id)}
                    onChange={(mut) => updateRecipe(t.id, r.id, mut)}
                  />
                ))}
              </ul>
            )}
          </>
        ) : (
          <EmptyTabs onAdd={addTab}/>
        )}

        <footer className="foot mono">
          <span>{canEdit ? 'Everything on this page is editable. Click any text to rename it.' : 'Read-only — add a GitHub token to edit.'}</span>
          <div className="foot-r">
            <div className="gh-actions">
              <div className="gh-action-group">
                <button
                  className={`gh-action-btn ${saveStatus === 'saving' ? 'busy' : ''}`}
                  onClick={handleSave}
                  disabled={saveStatus === 'saving'}
                >
                  {saveStatus === 'saving' ? '↑ Saving…' : '↑ Save to GitHub'}
                </button>
                {saveStatus === 'saved' && <span className="gh-status saved">✓ saved</span>}
                {saveStatus === 'error' && <span className="gh-status error" onClick={() => setShowToken(true)}>✗ failed</span>}
              </div>
              <div className="gh-action-group">
                <button
                  className={`gh-action-btn ${pullStatus === 'pulling' ? 'busy' : ''}`}
                  onClick={handlePull}
                  disabled={pullStatus === 'pulling'}
                >
                  {pullStatus === 'pulling' ? '↓ Pulling…' : '↓ Pull from GitHub'}
                </button>
                {pullStatus === 'pulled' && <span className="gh-status saved">✓ loaded</span>}
                {pullStatus === 'error'  && <span className="gh-status error" onClick={() => setShowToken(true)}>✗ failed</span>}
              </div>
              <button className="gh-token-btn" onClick={() => setShowToken(true)} title="GitHub token settings">⚙ token</button>
            </div>
          </div>
        </footer>
        {showToken && (
          <div className="modal-bg" onClick={() => setShowToken(false)}>
            <div className="confirm" onClick={e => e.stopPropagation()} style={{maxWidth: 480}}>
              <h3 className="serif">GitHub token</h3>
              <p>Create a token at <b>github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens</b>. Give it <b>Contents: Read and Write</b> access to <b>recipe_dashboard</b>.</p>
              <input
                className="modal-url-input mono"
                type="password"
                autoFocus
                placeholder="github_pat_…"
                defaultValue={ghToken}
                onKeyDown={e => {
                  if (e.key === 'Enter') {
                    const t = e.target.value.trim();
                    setGhToken(t);
                    localStorage.setItem(GH_TOKEN_KEY, t);
                    setShowToken(false);
                  }
                }}
              />
              <p style={{fontSize:11, color:'var(--mute)'}}>Press Enter to save. Stored only in your browser.</p>
              <div className="confirm-actions">
                {ghToken && <button className="btn-danger" onClick={() => { localStorage.removeItem(GH_TOKEN_KEY); setGhToken(''); setShowToken(false); }}>Remove token</button>}
                <button className="btn-secondary" onClick={() => setShowToken(false)}>Cancel</button>
                <button className="btn-primary" onClick={() => {
                  const input = document.querySelector('.confirm input');
                  const t = input?.value.trim() || '';
                  setGhToken(t);
                  localStorage.setItem(GH_TOKEN_KEY, t);
                  setShowToken(false);
                }}>Save</button>
              </div>
            </div>
          </div>
        )}
      </main>

      {/* MODAL */}
      {openR && (
        <RecipeModal
          recipe={openR}
          tab={data.tabs.find(t=>t.id===openRecipe.tabId)}
          onClose={() => setOpenRecipe(null)}
          onChange={(mut) => updateRecipe(openRecipe.tabId, openR.id, mut)}
          onRemove={() => { removeRecipe(openRecipe.tabId, openR.id); setOpenRecipe(null); }}
        />
      )}

      {/* CONFIRM REMOVE TAB */}
      {confirmTab && (
        <ConfirmDialog
          title="Remove this cuisine?"
          body={`"${data.tabs.find(t=>t.id===confirmTab)?.name}" and its ${data.tabs.find(t=>t.id===confirmTab)?.recipes.length||0} recipe(s) will be deleted.`}
          confirmLabel="Remove"
          danger
          onCancel={()=>setConfirmTab(null)}
          onConfirm={()=>removeTab(confirmTab)}
        />
      )}
    </div>
    </EditCtx.Provider>
  );
}

/* ---------- Recipe card ---------- */
function RecipeCard({ recipe, hue, onOpen, onRemove, onChange }) {
  const canEdit = React.useContext(EditCtx);
  const onCardClick = (e) => {
    if (e.target.closest('button, .no-open')) return;
    if (canEdit && e.target.closest('[contenteditable="true"]')) return;
    onOpen();
  };
  return (
    <li className="card" onClick={onCardClick} style={{ '--tab-hue': hue }}>
      <div className="card-art">
        {recipe.image
          ? <img className="card-img" src={recipe.image} alt={recipe.name} loading="lazy" referrerPolicy="no-referrer" />
          : <RecipePlate name={recipe.name} hue={hue} size={120} />}
        <span className="card-tag mono"><Editable as="span" value={recipe.tag} onChange={v=>onChange(r=>({...r, tag:v}))} placeholder="Tag" maxLen={16} /></span>
        {recipe.link && (
          <a className="card-source no-open mono"
             href={recipe.link} target="_blank" rel="noopener noreferrer"
             onClick={e=>e.stopPropagation()}
             title={recipe.link}>
            <Ico.link/> source
          </a>
        )}
      </div>
      <div className="card-body">
        <Editable
          as="h3"
          className="card-title"
          value={recipe.name}
          onChange={v=>onChange(r=>({...r, name:v}))}
          placeholder="Dish name"
          maxLen={64}
        />
        <div className="card-meta">
          <span className="meta-time"><Ico.clock/>
            <Editable as="span" value={recipe.time} onChange={v=>onChange(r=>({...r, time:v}))} placeholder="time" maxLen={20}/>
          </span>
          <span className="dot">·</span>
          <span className="meta-open">Open recipe <Ico.arrow/></span>
        </div>
      </div>
      {canEdit && (
        <button className="card-x no-open" onClick={(e)=>{ e.stopPropagation(); onRemove(); }} aria-label="Remove recipe">
          <Ico.x/>
        </button>
      )}
    </li>
  );
}

/* ---------- Empty states ---------- */
function EmptyState({ onAdd }) {
  return (
    <div className="empty">
      <div className="empty-art" aria-hidden="true">
        <RecipePlate name="?" hue={60} size={140}/>
      </div>
      <div className="empty-body">
        <div className="kicker mono">EMPTY SHELF</div>
        <h2 className="serif">No dishes here yet.</h2>
        <p>Add your first recipe — name it, set a time, jot a note. Everything saves automatically.</p>
        <button className="btn-primary" onClick={onAdd}><Ico.plus/><span>Add recipe</span></button>
      </div>
    </div>
  );
}
function NoMatch({ query, onClear }) {
  return (
    <div className="empty">
      <div className="empty-body">
        <div className="kicker mono">NOTHING MATCHES</div>
        <h2 className="serif">Nothing here for "{query}".</h2>
        <p>Try another word, or clear the search.</p>
        <button className="btn-secondary" onClick={onClear}>Clear search</button>
      </div>
    </div>
  );
}
function EmptyTabs({ onAdd }) {
  return (
    <div className="empty">
      <div className="empty-body">
        <div className="kicker mono">FRESH START</div>
        <h2 className="serif">Your notebook is empty.</h2>
        <p>Add a cuisine to begin collecting recipes.</p>
        <button className="btn-primary" onClick={onAdd}><Ico.plus/><span>Add cuisine</span></button>
      </div>
    </div>
  );
}

/* ---------- Modal: full recipe ---------- */
function RecipeModal({ recipe, tab, onClose, onChange, onRemove }) {
  const canEdit = React.useContext(EditCtx);
  const [editingImage, setEditingImage] = useState(false);
  const [editingLink, setEditingLink] = useState(false);
  const ingredients = recipe.ingredients || [];

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('keydown', onKey); };
  }, [onClose]);

  const updateIng = (i, val) => onChange(r => {
    const list = [...(r.ingredients || [])];
    list[i] = val;
    return { ...r, ingredients: list };
  });
  const removeIng = (i) => onChange(r => {
    const list = [...(r.ingredients || [])];
    list.splice(i, 1);
    return { ...r, ingredients: list };
  });
  const addIng = () => onChange(r => ({ ...r, ingredients: [...(r.ingredients || []), ''] }));

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{ '--tab-hue': tab.hue }}>
        <div className="modal-art">
          <div className="modal-art-img">
            {recipe.image
              ? <img src={recipe.image} alt={recipe.name} referrerPolicy="no-referrer"/>
              : <RecipePlate name={recipe.name} hue={tab.hue} size={220}/>}
          </div>
          <div className="modal-art-meta mono">
            <span className="modal-cuisine">{tab.name.toUpperCase()}</span>
            <Editable as="span" value={recipe.tag} onChange={v=>onChange(r=>({...r, tag:v}))} maxLen={20}/>
          </div>
          {canEdit && (
            <button className="modal-art-edit mono" onClick={()=>setEditingImage(v=>!v)}>
              <Ico.edit/> {recipe.image ? 'Change photo URL' : 'Add photo URL'}
            </button>
          )}
          {canEdit && editingImage && (
            <input
              className="modal-url-input mono"
              type="url"
              autoFocus
              defaultValue={recipe.image || ''}
              placeholder="https://…"
              onBlur={(e) => { onChange(r=>({...r, image: e.target.value.trim()})); setEditingImage(false); }}
              onKeyDown={(e) => { if (e.key==='Enter') e.target.blur(); if (e.key==='Escape') setEditingImage(false); }}
            />
          )}
        </div>
        <div className="modal-body">
          <button className="modal-close" onClick={onClose} aria-label="Close"><Ico.x/></button>
          <div className="kicker mono">RECIPE</div>
          <Editable as="h2" className="modal-title serif" value={recipe.name} onChange={v=>onChange(r=>({...r, name:v}))} maxLen={80}/>
          <div className="modal-meta">
            <span className="meta-time"><Ico.clock/>
              <Editable as="span" value={recipe.time} onChange={v=>onChange(r=>({...r, time:v}))} maxLen={20}/>
            </span>
            {recipe.link && !editingLink ? (
              <a className="modal-source mono" href={recipe.link} target="_blank" rel="noopener noreferrer">
                <Ico.link/> View source
              </a>
            ) : null}
            {canEdit && (
              <button className="modal-source-edit mono no-open" onClick={()=>setEditingLink(v=>!v)}>
                <Ico.edit/> {recipe.link ? 'Edit link' : 'Add source link'}
              </button>
            )}
          </div>
          {canEdit && editingLink && (
            <input
              className="modal-url-input mono"
              type="url"
              autoFocus
              defaultValue={recipe.link || ''}
              placeholder="https://…"
              onBlur={(e) => { onChange(r=>({...r, link: e.target.value.trim()})); setEditingLink(false); }}
              onKeyDown={(e) => { if (e.key==='Enter') e.target.blur(); if (e.key==='Escape') setEditingLink(false); }}
            />
          )}

          <div className="modal-section">
            <div className="kicker mono"><Ico.list/> INGREDIENTS</div>
            {ingredients.length === 0 ? (
              <p className="ing-empty">No ingredients yet. Add the first one below.</p>
            ) : (
              <ul className="ing-list">
                {ingredients.map((ing, i) => (
                  <li key={i} className="ing-row">
                    <span className="ing-bullet" aria-hidden="true">▢</span>
                    <Editable
                      as="span"
                      className="ing-text"
                      value={ing}
                      onChange={v => updateIng(i, v)}
                      placeholder="e.g. 2 cups flour"
                      maxLen={120}
                    />
                    {canEdit && <button className="ing-x" aria-label="Remove ingredient" onClick={()=>removeIng(i)}><Ico.x/></button>}
                  </li>
                ))}
              </ul>
            )}
            {canEdit && <button className="ing-add" onClick={addIng}><Ico.plus/> <span>Add ingredient</span></button>}
          </div>

          <div className="modal-section">
            <div className="kicker mono">NOTES</div>
            <Editable
              as="p"
              className="modal-note"
              value={recipe.note || ''}
              onChange={v=>onChange(r=>({...r, note:v}))}
              placeholder="Method, what you'd change next time…"
              maxLen={1200}
            />
          </div>
          <div className="modal-actions">
            <button className="btn-secondary" onClick={onClose}>Done</button>
            {canEdit && <button className="btn-danger" onClick={onRemove}>Delete recipe</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Confirm dialog ---------- */
function ConfirmDialog({ title, body, confirmLabel='Confirm', onCancel, onConfirm, danger }) {
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
  return (
    <div className="modal-bg" onClick={onCancel}>
      <div className="confirm" onClick={e=>e.stopPropagation()}>
        <h3 className="serif">{title}</h3>
        <p>{body}</p>
        <div className="confirm-actions">
          <button className="btn-secondary" onClick={onCancel}>Cancel</button>
          <button className={danger ? "btn-danger" : "btn-primary"} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

  .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; gap: 24px; }
  .cuisine-tag {
    --tab-color: oklch(0.78 0.13 var(--tab-hue, 60));
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.18em; color: oklch(from var(--tab-color) 0.86 0.06 h);
  }
  .cuisine-swatch { width: 22px; height: 6px; border-radius: 3px; background: var(--tab-color); }

  .btn-primary, .btn-secondary, .btn-danger {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
    transition: transform 100ms, background 140ms, border-color 140ms;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent); color: oklch(0.18 0.02 60);
    border-color: oklch(from var(--accent) calc(l - 0.06) c h);
  }
  .btn-primary:hover { background: oklch(from var(--accent) calc(l + 0.04) c h); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary { background: var(--card); border-color: var(--line); color: var(--ink); }
  .btn-secondary:hover { background: var(--card-hi); }
  .btn-danger { background: oklch(0.30 0.05 25); color: oklch(0.95 0.04 25); border-color: oklch(0.42 0.10 25); }
  .btn-danger:hover { background: oklch(0.36 0.08 25); }

  /* ---------- Recipe grid ---------- */
  .grid {
    list-style: none; padding: 0; margin: 0;
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    --tab-color: oklch(0.78 0.13 var(--tab-hue, 60));
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    display: flex; flex-direction: column;
    transition: transform 200ms cubic-bezier(.2,.8,.2,1), border-color 200ms, background 200ms, box-shadow 200ms;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: oklch(from var(--tab-color) 0.50 0.10 h);
    background: var(--card-hi);
    box-shadow: var(--shadow);
  }
  .card-art {
    aspect-ratio: 16 / 10;
    background:
      radial-gradient(120% 80% at 30% 20%, oklch(from var(--tab-color) 0.32 0.06 h), oklch(0.18 0.02 60));
    display: grid; place-items: center;
    position: relative;
    border-bottom: 1px solid var(--line);
  }
  .card-art > svg { filter: drop-shadow(0 12px 24px rgba(0,0,0,.35)); }
  .card-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-source {
    position: absolute; bottom: 12px; right: 12px;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px;
    background: oklch(0.16 0.012 60 / 0.78);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(0.96 0.01 75 / 0.18);
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: oklch(0.92 0.014 70); text-decoration: none;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .card-source:hover { background: var(--accent); color: oklch(0.18 0.012 60); border-color: var(--accent); }
  .card-tag {
    position: absolute; top: 12px; left: 12px;
    padding: 4px 8px; border-radius: 6px;
    background: oklch(0.16 0.012 60 / 0.7);
    backdrop-filter: blur(8px);
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: oklch(from var(--tab-color) 0.92 0.04 h);
    border: 1px solid oklch(from var(--tab-color) l c h / 0.25);
    white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  }
  .card-body { padding: 16px 18px 18px; }
  .card-title {
    margin: 0; font-size: 18px; font-weight: 600; line-height: 1.25;
    letter-spacing: -0.01em; color: var(--ink);
  }
  .card-meta {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px;
    font-size: 13px; color: var(--mute);
  }
  .meta-time { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; }
  .meta-open { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); margin-left: auto; transition: color 140ms, gap 140ms; white-space: nowrap; }
  .card:hover .meta-open { color: var(--accent); gap: 10px; }
  .card-meta .dot { color: var(--mute-2); }

  .card-x {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    background: oklch(0.16 0.012 60 / 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    color: var(--ink-2);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity 140ms, background 140ms, color 140ms, transform 140ms;
  }
  .card:hover .card-x { opacity: 1; }
  .card-x:hover { background: var(--danger); color: #fff; transform: scale(1.05); }

  /* ---------- Empty ---------- */
  .empty {
    display: flex; gap: 28px; align-items: center;
    padding: 56px 32px;
    background: var(--card); border: 1px dashed var(--line);
    border-radius: 16px;
  }
  .empty-art { flex-shrink: 0; }
  .empty-body { display: flex; flex-direction: column; gap: 8px; }
  .empty h2 { margin: 4px 0 0; font-size: 26px; font-weight: 400; color: var(--ink); }
  .empty p { margin: 0 0 12px; color: var(--ink-2); max-width: 440px; }
  .empty .btn-primary, .empty .btn-secondary { align-self: flex-start; margin-top: 8px; }

  /* ---------- Foot ---------- */
  .foot {
    margin-top: 56px; padding-top: 18px;
    border-top: 1px solid var(--line-soft);
    display: flex; justify-content: space-between;
    color: var(--mute-2); font-size: 11px; letter-spacing: 0.06em;
  }

  /* ---------- Modal ---------- */
  .modal-bg {
    position: fixed; inset: 0; z-index: 60;
    background: oklch(0.10 0.01 60 / 0.7);
    backdrop-filter: blur(4px);
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px;
    animation: fade 180ms ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    --tab-color: oklch(0.78 0.13 var(--tab-hue, 60));
    width: min(900px, 100%); margin: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden;
    display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: pop 220ms cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-art {
    background: radial-gradient(120% 80% at 30% 20%, oklch(from var(--tab-color) 0.34 0.07 h), oklch(0.18 0.02 60));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; gap: 14px;
    border-right: 1px solid var(--line);
  }
  .modal-art-img {
    width: 100%; aspect-ratio: 4/5; max-height: 360px;
    border-radius: 14px; overflow: hidden;
    background: oklch(0.20 0.02 60);
    border: 1px solid oklch(0.96 0.01 75 / 0.08);
    box-shadow: 0 16px 30px rgba(0,0,0,.4);
    display: grid; place-items: center;
  }
  .modal-art-img > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-art-img > svg { filter: drop-shadow(0 16px 30px rgba(0,0,0,.5)); }
  .modal-art-edit {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: oklch(from var(--tab-color) 0.86 0.04 h);
    padding: 6px 10px; border-radius: 999px;
    border: 1px dashed oklch(from var(--tab-color) l c h / 0.35);
    transition: background 140ms, color 140ms, border-color 140ms;
    white-space: nowrap;
  }
  .modal-art-edit:hover { background: oklch(from var(--tab-color) l c h / 0.18); color: oklch(from var(--tab-color) 0.96 0.04 h); border-style: solid; }
  .modal-art-meta {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 0.16em; color: oklch(from var(--tab-color) 0.94 0.04 h);
  }
  .modal-cuisine {
    padding: 4px 10px; border-radius: 999px;
    background: oklch(from var(--tab-color) l c h / 0.2);
    border: 1px solid oklch(from var(--tab-color) l c h / 0.3);
  }
  .modal-body { padding: 32px 36px; position: relative; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 8px;
    color: var(--mute); border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: background 140ms, color 140ms;
  }
  .modal-close:hover { background: var(--card-hi); color: var(--ink); }
  .modal-title {
    font-size: 36px; font-weight: 400; line-height: 1.05; margin: 6px 0 0; color: var(--ink);
    letter-spacing: -0.01em;
  }
  .modal-meta { margin: 14px 0 22px; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .modal-source {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: oklch(from var(--tab-color) l c h / 0.16);
    color: oklch(from var(--tab-color) 0.92 0.06 h);
    border: 1px solid oklch(from var(--tab-color) l c h / 0.3);
    text-decoration: none; transition: background 140ms, color 140ms;
    white-space: nowrap;
  }
  .modal-source:hover { background: var(--accent); color: oklch(0.18 0.012 60); border-color: var(--accent); }
  .modal-source-edit {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--mute); font-size: 11px; letter-spacing: 0.08em;
    padding: 4px 8px; border-radius: 6px;
    transition: background 140ms, color 140ms;
    white-space: nowrap;
  }
  .modal-source-edit:hover { background: var(--card-hi); color: var(--ink); }
  .modal-url-input {
    width: 100%; box-sizing: border-box;
    margin: 0 0 14px; padding: 10px 12px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink);
    font: inherit; font-size: 13px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    outline: none;
  }
  .modal-url-input:focus { border-color: var(--accent); }

  /* Ingredients */
  .ing-empty { color: var(--mute); font-size: 13px; margin: 10px 0 0; font-style: italic; }
  .ing-list {
    list-style: none; padding: 0; margin: 14px 0 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .ing-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 8px 8px 0; border-radius: 6px;
    transition: background 140ms;
  }
  .ing-row:hover { background: oklch(0.96 0.01 75 / 0.03); }
  .ing-bullet {
    color: oklch(from var(--tab-color) 0.78 0.12 h);
    font-size: 12px; line-height: 1.55; flex-shrink: 0; padding-top: 1px;
  }
  .ing-text {
    flex: 1; color: var(--ink-2); font-size: 14px; line-height: 1.55;
    min-height: 1em;
  }
  .ing-x {
    width: 22px; height: 22px; border-radius: 50%;
    color: var(--mute); display: grid; place-items: center;
    opacity: 0; flex-shrink: 0;
    transition: opacity 120ms, background 120ms, color 120ms;
  }
  .ing-row:hover .ing-x { opacity: 1; }
  .ing-x:hover { background: var(--danger); color: #fff; }
  .ing-add {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 8px 12px;
    border: 1px dashed var(--line);
    border-radius: 8px; color: var(--mute);
    font-size: 13px;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .ing-add:hover { color: var(--ink); border-color: var(--mute); border-style: solid; background: var(--card-hi); }
  .ing-add svg { color: var(--accent); }

  .kicker svg { display: inline-block; vertical-align: -2px; margin-right: 4px; color: oklch(from var(--accent) l c h / 0.7); }
  .modal-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .modal-note {
    margin: 10px 0 0;
    color: var(--ink-2); line-height: 1.65; font-size: 15px;
    min-height: 80px;
    white-space: pre-wrap;
  }
  .modal-actions { display: flex; gap: 12px; margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line-soft); }
  .modal-actions .btn-secondary { margin-right: auto; }

  /* ---------- Confirm ---------- */
  .confirm {
    width: min(420px, 100%);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: pop 220ms cubic-bezier(.2,.8,.2,1);
  }
  .confirm h3 { margin: 0 0 8px; font-weight: 500; font-size: 20px; color: var(--ink); }
  .confirm p { margin: 0 0 20px; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- Editable placeholders ---------- */
  [contenteditable="true"]:empty::before {
    content: attr(data-placeholder);
    color: var(--mute-2);
    pointer-events: none;
  }

  /* ---------- GitHub actions ---------- */
  .gh-actions { display: flex; align-items: center; gap: 14px; }
  .gh-action-group { display: flex; align-items: center; gap: 8px; }
  .gh-action-btn {
    font-size: 11px; letter-spacing: 0.08em;
    padding: 6px 12px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--ink-2);
    transition: background 140ms, border-color 140ms, color 140ms;
    white-space: nowrap;
  }
  .gh-action-btn:hover:not(:disabled) { background: var(--card-hi); border-color: var(--mute); color: var(--ink); }
  .gh-action-btn:disabled { opacity: 0.5; cursor: default; }
  .gh-action-btn.busy { color: var(--mute); }
  .gh-token-btn {
    font-size: 11px; color: var(--mute-2); letter-spacing: 0.06em;
    padding: 4px 8px; border-radius: 6px; border: 1px solid transparent;
    transition: color 140ms, border-color 140ms;
  }
  .gh-token-btn:hover { color: var(--mute); border-color: var(--line); }
  .gh-status { font-size: 11px; }
  .gh-status.saved  { color: var(--good); }
  .gh-status.error  { color: var(--danger); cursor: pointer; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .hdr { flex-direction: column; align-items: stretch; gap: 18px; }
    .hdr-right { flex-direction: column; align-items: stretch; gap: 12px; }
    .search { min-width: 0; }
    .modal { grid-template-columns: 1fr; }
    .modal-art { border-right: 0; border-bottom: 1px solid var(--line); padding: 24px; }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 28px; }
    .section-head { flex-direction: column; align-items: stretch; gap: 14px; }
    .section-head .btn-primary { align-self: flex-start; }
  }
</style>
</body>
</html>
